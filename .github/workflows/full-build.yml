name: Full build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - bare-linux
    tags:
      - "v*"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.yml"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.yml"

permissions:
  contents: read

concurrency:
  group: full-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platforms;android-36
            platforms;android-36.1
            build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

  boot-assets:
    name: Kernel and initramfs
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Read kernel version
        id: versions
        run: |
          kernel_version="$(sed -n 's/^podroidKernelVersion=//p' gradle.properties)"
          test -n "$kernel_version"
          echo "kernel=$kernel_version" >> "$GITHUB_OUTPUT"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bc binfmt-support binutils-aarch64-linux-gnu bison ca-certificates \
            cpio curl flex gcc-aarch64-linux-gnu kmod libelf-dev libssl-dev \
            make qemu-user-static xz-utils
          sudo update-binfmts --enable qemu-aarch64

      - name: Build kernel and initramfs natively
        env:
          PODROID_KERNEL_VERSION: ${{ steps.versions.outputs.kernel }}
        run: bash .github/scripts/build-boot-assets.sh ci-output/boot

      - name: Verify boot artifacts
        run: |
          test -s ci-output/boot/vmlinuz-virt
          test -s ci-output/boot/initrd.img

      - name: Upload boot artifacts
        uses: actions/upload-artifact@v7
        with:
          name: boot-assets
          path: ci-output/boot/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  rootfs:
    name: Alpine rootfs
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Read system version
        id: versions
        run: |
          system_version="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*$/\1/p' app/build.gradle.kts | head -1)"
          test -n "$system_version"
          echo "system=$system_version" >> "$GITHUB_OUTPUT"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binfmt-support binutils-aarch64-linux-gnu ca-certificates curl \
            gcc-aarch64-linux-gnu openssl qemu-user-static squashfs-tools
          sudo update-binfmts --enable qemu-aarch64

      - name: Build Alpine rootfs natively
        env:
          PODROID_SYSTEM_VERSION: ${{ steps.versions.outputs.system }}
        run: bash .github/scripts/build-rootfs.sh ci-output/rootfs

      - name: Verify rootfs artifact
        run: test -s ci-output/rootfs/alpine-rootfs.squashfs

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v7
        with:
          name: rootfs
          path: ci-output/rootfs/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  qemu:
    name: QEMU and native helpers
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Read QEMU version
        id: versions
        run: |
          qemu_version="$(sed -n 's/^podroidQemuVersion=//p' gradle.properties)"
          test -n "$qemu_version"
          echo "qemu=$qemu_version" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android NDK r27c
        uses: android-actions/setup-android@v4
        with:
          packages: ndk;27.2.12479018

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            autoconf automake bison bzip2 ca-certificates cmake curl flex \
            gettext git libglib2.0-bin \
            libglib2.0-dev libintl-perl libtool make ninja-build patchelf \
            pkg-config python3-venv xz-utils
          python3 -m venv "$RUNNER_TEMP/meson-venv"
          "$RUNNER_TEMP/meson-venv/bin/pip" install meson

      - name: Build QEMU and helpers natively
        env:
          PODROID_QEMU_VERSION: ${{ steps.versions.outputs.qemu }}
        run: |
          export PATH="$RUNNER_TEMP/meson-venv/bin:$PATH"
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          bash .github/scripts/build-qemu.sh ci-output/qemu

      - name: Verify native artifacts
        run: |
          for file in \
            libqemu-system-aarch64.so \
            libslirp.so \
            libpodroid-bridge.so \
            libpodroid-launcher.so; do
            test -s "ci-output/qemu/$file"
          done
          test -s ci-output/qemu/qemu/efi-virtio.rom
          test -n "$(find ci-output/qemu/qemu/keymaps -type f -print -quit)"

      - name: Verify 16 KB ELF alignment
        run: |
          python3 - ci-output/qemu/libqemu-system-aarch64.so <<'PY'
          import struct
          import sys

          path = sys.argv[1]
          with open(path, "rb") as stream:
              data = stream.read()
          phoff = struct.unpack_from("<Q", data, 32)[0]
          phentsize = struct.unpack_from("<H", data, 54)[0]
          phnum = struct.unpack_from("<H", data, 56)[0]
          aligns = [
              struct.unpack_from("<Q", data, phoff + index * phentsize + 48)[0]
              for index in range(phnum)
              if struct.unpack_from("<I", data, phoff + index * phentsize)[0] == 1
          ]
          if not aligns or any(alignment < 16384 for alignment in aligns):
              raise SystemExit(f"{path} is not 16 KB page aligned: {aligns}")
          PY

      - name: Upload QEMU artifacts
        uses: actions/upload-artifact@v7
        with:
          name: qemu-assets
          path: ci-output/qemu/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  apk:
    name: Assemble debug APK
    needs:
      - unit-tests
      - boot-assets
      - rootfs
      - qemu
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Download boot artifacts
        uses: actions/download-artifact@v7
        with:
          name: boot-assets
          path: app/src/main/assets

      - name: Download rootfs artifact
        uses: actions/download-artifact@v7
        with:
          name: rootfs
          path: app/src/main/assets

      - name: Download QEMU artifacts
        uses: actions/download-artifact@v7
        with:
          name: qemu-assets
          path: ci-output/qemu

      - name: Install QEMU artifacts into the Android module
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets/qemu
          install -m 0755 ci-output/qemu/libqemu-system-aarch64.so app/src/main/jniLibs/arm64-v8a/
          install -m 0755 ci-output/qemu/libslirp.so app/src/main/jniLibs/arm64-v8a/
          install -m 0755 ci-output/qemu/libpodroid-bridge.so app/src/main/jniLibs/arm64-v8a/
          install -m 0755 ci-output/qemu/libpodroid-launcher.so app/src/main/jniLibs/arm64-v8a/
          cp -R ci-output/qemu/qemu/. app/src/main/assets/qemu/

      - name: Verify complete APK inputs
        run: |
          test -s app/src/main/assets/vmlinuz-virt
          test -s app/src/main/assets/initrd.img
          test -s app/src/main/assets/alpine-rootfs.squashfs
          for file in \
            libqemu-system-aarch64.so \
            libslirp.so \
            libpodroid-bridge.so \
            libpodroid-launcher.so; do
            test -s "app/src/main/jniLibs/arm64-v8a/$file"
          done

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platforms;android-36
            platforms;android-36.1
            build-tools;36.0.0
            ndk;27.2.12479018

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Generate SHA-256 checksum
        working-directory: app/build/outputs/apk/debug
        run: sha256sum app-debug.apk > app-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: podroid-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
