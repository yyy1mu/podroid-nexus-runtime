name: Nexus runtime bundle release

on:
  push:
    tags:
      - "v*-bundle"

permissions:
  contents: write

concurrency:
  group: nexus-runtime-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Assemble and boot-test pinned runtime components
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Read component lock
        id: components
        run: |
          release="$(bash .github/scripts/validate-release-tag.sh bundle "$GITHUB_REF_NAME")"
          rootfs="$(sed -n 's/^runtimeRootfsTag=//p' runtime.lock)"
          boot="$(sed -n 's/^runtimeBootTag=//p' runtime.lock)"
          qemu="$(sed -n 's/^runtimeQemuTag=//p' runtime.lock)"
          test -n "$rootfs" && test -n "$boot" && test -n "$qemu"
          test "$rootfs" = "v${release}-rootfs"
          test "$boot" = "v${release}-boot"
          test "$qemu" = "v${release}-qemu"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "rootfs=$rootfs" >> "$GITHUB_OUTPUT"
          echo "boot=$boot" >> "$GITHUB_OUTPUT"
          echo "qemu=$qemu" >> "$GITHUB_OUTPUT"

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            curl e2fsprogs openssh-client qemu-system-arm sshpass zstd

      - name: Download and verify immutable components
        env:
          GH_TOKEN: ${{ github.token }}
          ROOTFS_TAG: ${{ steps.components.outputs.rootfs }}
          BOOT_TAG: ${{ steps.components.outputs.boot }}
          QEMU_TAG: ${{ steps.components.outputs.qemu }}
        run: |
          bash .github/scripts/download-runtime-component.sh rootfs "$ROOTFS_TAG" components
          bash .github/scripts/download-runtime-component.sh boot "$BOOT_TAG" components
          bash .github/scripts/download-runtime-component.sh qemu "$QEMU_TAG" components

      - name: Assemble runtime contract
        env:
          ROOTFS_TAG: ${{ steps.components.outputs.rootfs }}
          BOOT_TAG: ${{ steps.components.outputs.boot }}
          QEMU_TAG: ${{ steps.components.outputs.qemu }}
        run: |
          runtime=bundle/nexus-runtime
          mkdir -p "$runtime/assets/vm/qemu" "$runtime/jniLibs/arm64-v8a"
          install -m 0644 components/nexus-rootfs/alpine-rootfs.squashfs "$runtime/assets/vm/"
          install -m 0644 \
            components/nexus-boot/vmlinuz-virt \
            components/nexus-boot/initrd.img \
            "$runtime/assets/vm/"
          if [ -s components/nexus-boot/kernel-metrics.properties ]; then
            install -m 0644 \
              components/nexus-boot/kernel-metrics.properties \
              "$runtime/assets/vm/"
          fi
          install -m 0755 \
            components/nexus-qemu/libqemu-system-aarch64.so \
            components/nexus-qemu/libslirp.so \
            components/nexus-qemu/libpodroid-launcher.so \
            "$runtime/jniLibs/arm64-v8a/"
          cp -R components/nexus-qemu/qemu/. "$runtime/assets/vm/qemu/"
          cp runtime.properties "$runtime/runtime.properties"
          printf '%s\n' \
            "nexusReleaseVersion=${{ steps.components.outputs.release }}" \
            "tag=${GITHUB_REF_NAME}" \
            "commit=${GITHUB_SHA}" \
            "runtimeRootfsTag=${ROOTFS_TAG}" \
            "runtimeBootTag=${BOOT_TAG}" \
            "runtimeQemuTag=${QEMU_TAG}" \
            >> "$runtime/runtime.properties"
          (
            cd "$runtime"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | \
              xargs -0 sha256sum > SHA256SUMS
          )

      - name: Verify assembled runtime
        run: bash .github/scripts/verify-runtime-bundle.sh bundle/nexus-runtime

      - name: Boot runtime and verify OpenCode, TUN/TAP and TBF
        run: bash .github/scripts/smoke-test-runtime.sh bundle/nexus-runtime

      - name: Pack runtime bundle
        run: |
          archive="nexus-runtime-${GITHUB_REF_NAME}.tar.zst"
          tar --zstd -cf "$archive" -C bundle nexus-runtime
          sha256sum "$archive" > "$archive.sha256"

      - name: Publish runtime bundle
        env:
          GH_TOKEN: ${{ github.token }}
          ROOTFS_TAG: ${{ steps.components.outputs.rootfs }}
          BOOT_TAG: ${{ steps.components.outputs.boot }}
          QEMU_TAG: ${{ steps.components.outputs.qemu }}
        run: |
          archive="nexus-runtime-${GITHUB_REF_NAME}.tar.zst"
          gh release create "$GITHUB_REF_NAME" \
            "$archive" "$archive.sha256" \
            --latest \
            --title "Nexus Runtime ${GITHUB_REF_NAME}" \
            --notes "Complete Nexus Android runtime ${GITHUB_REF_NAME}. Includes the verified rootfs, kernel/initramfs, and QEMU Android binaries."

      - name: Remove internal component drafts
        env:
          GH_TOKEN: ${{ github.token }}
          ROOTFS_TAG: ${{ steps.components.outputs.rootfs }}
          BOOT_TAG: ${{ steps.components.outputs.boot }}
          QEMU_TAG: ${{ steps.components.outputs.qemu }}
        run: |
          for tag in "$ROOTFS_TAG" "$BOOT_TAG" "$QEMU_TAG"; do
            release_id="$(
              gh api --paginate \
                "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                | jq -r --arg tag "$tag" \
                    '.[] | select(.tag_name == $tag and .draft == true) | .id' \
                | head -n 1
            )"
            test -n "$release_id"
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/releases/$release_id"
          done
